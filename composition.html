<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Composition - TACHKILA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="js/page-composition.js" type="module"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-950 text-white">
    <a href="#contenu" class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:rounded focus:bg-white focus:p-2 focus:text-black">Aller au contenu</a>

    <header class="sticky top-0 z-40 flex flex-wrap items-center justify-between gap-3 bg-gradient-to-r from-cyan-950 to-indigo-950 px-4 py-2">
        <a href="index.html" class="flex items-center gap-2 font-bold text-white">
            <span class="rounded-full bg-green-600 p-1" aria-hidden="true">&#9917;</span>
            TACHKILA
        </a>

        <nav aria-label="Navigation principale" class="rounded-lg bg-gradient-to-l from-cyan-800 to-indigo-800 p-2">
            <ul class="flex flex-row gap-1">
                <li><a href="index.html" class="block rounded-lg border-2 border-white/60 p-2 font-bold text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white bg-cyan-900 hover:bg-cyan-700">Effectif</a></li>
                <li><a href="composition.html" aria-current="page" class="block rounded-lg border-2 border-white/60 p-2 font-bold text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white bg-cyan-600">Composition</a></li>
                <li><a href="matches.html" class="block rounded-lg border-2 border-white/60 p-2 font-bold text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white bg-cyan-900 hover:bg-cyan-700">Matchs</a></li>
            </ul>
        </nav>

        <ul aria-label="Légende des postes" class="hidden flex-wrap rounded-lg border-2 border-solid bg-indigo-950 p-3 font-bold [border-image:linear-gradient(to_right,yellow,blue,green,red)_1] md:flex">
            <li class="mx-2 text-nowrap text-yellow-500"><span aria-hidden="true">&#9679;</span> GB</li>
            <li class="mx-2 text-nowrap text-blue-500"><span aria-hidden="true">&#9679;</span> DEF</li>
            <li class="mx-2 text-nowrap text-green-500"><span aria-hidden="true">&#9679;</span> MIL</li>
            <li class="mx-2 text-nowrap text-red-500"><span aria-hidden="true">&#9679;</span> ATT</li>
        </ul>

        <p class="text-nowrap font-mono font-bold text-white">Schéma <span class="rounded-lg border-2 border-solid border-white bg-sky-800 p-2">4-4-2</span></p>
    </header>

    <div id="message" role="status" aria-live="polite" class="hidden fixed right-5 top-20 z-50 rounded-lg p-3 font-bold text-white shadow-lg"></div>

    <main id="contenu" class="flex flex-col lg:flex-row">
        <h1 class="sr-only">Composition de l'équipe</h1>

        <aside aria-label="Joueurs de l'effectif" class="flex w-full flex-col bg-gradient-to-b from-cyan-700 to-indigo-900 lg:w-80 lg:shrink-0">
            <div class="flex items-center justify-between p-3 text-white">
                <h2 class="font-bold">Effectif</h2>
                <p class="rounded-lg bg-blue-950 p-2"><span id="nbJoueurs">0</span> joueur(s)</p>
            </div>
            <p class="mb-2 flex items-center justify-between px-3 text-sm text-white">
                Joueurs placés :
                <span class="rounded bg-blue-950 p-1 font-bold"><span id="nbPlaces">0</span> / 11</span>
            </p>
            <ul id="listeJoueurs" class="flex max-h-96 flex-col gap-2 overflow-y-auto px-3 pb-3 lg:max-h-[78vh]"></ul>
        </aside>

        <section aria-label="Terrain" class="flex flex-1 justify-center bg-gradient-to-b from-indigo-950 to-gray-950 py-3">
            <div class="divGrid my-3" role="group" aria-label="Terrain de football, schéma 4-4-2">
                <div class="row">
                    <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div>
                </div>
                <div class="row">
                    <div></div> <div></div> <div></div>
                    <div class="slot bg-cyan-600 flex items-center justify-center font-bold text-white" data-position="dg" data-label="DG"></div>
                    <div></div> <div></div>
                    <div class="slot bg-green-600 flex items-center justify-center font-bold text-white" data-position="mg" data-label="MG"></div>
                    <div></div> <div></div> <div></div>
                </div>
                <div class="row">
                    <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div>
                    <div class="slot bg-red-600 flex items-center justify-center font-bold text-white" data-position="bu1" data-label="BU"></div>
                </div>
                <div class="row">
                    <div class="keeper bg-yellow-600 flex items-center justify-center font-bold text-white" data-position="gb" data-label="GB"></div>
                    <div class="slot bg-cyan-600 flex items-center justify-center font-bold text-white" data-position="dc1" data-label="DC"></div>
                    <div></div> <div></div>
                    <div class="slot bg-green-600 flex items-center justify-center font-bold text-white" data-position="mc1" data-label="MC"></div>
                    <div></div> <div></div> <div></div> <div></div>
                </div>
                <div class="row">
                    <div class="start3"></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div>
                </div>
                <div class="row">
                    <div class="slot start3 bg-cyan-600 flex items-center justify-center font-bold text-white" data-position="dc2" data-label="DC"></div>
                    <div></div> <div></div>
                    <div class="slot bg-green-600 flex items-center justify-center font-bold text-white" data-position="mc2" data-label="MC"></div>
                    <div></div> <div></div> <div></div> <div></div>
                </div>
                <div class="row">
                    <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div>
                    <div class="slot bg-red-600 flex items-center justify-center font-bold text-white" data-position="bu2" data-label="BU"></div>
                </div>
                <div class="row">
                    <div></div> <div></div> <div></div>
                    <div class="slot bg-cyan-600 flex items-center justify-center font-bold text-white" data-position="dd" data-label="DD"></div>
                    <div></div> <div></div>
                    <div class="slot bg-green-600 flex items-center justify-center font-bold text-white" data-position="md" data-label="MD"></div>
                    <div></div> <div></div> <div></div>
                </div>
                <div class="row">
                    <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div> <div></div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
